<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
	
    <title>Seises</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    
    <header class="titulo">
		<div class="header-left">
			<div class="language-selector">
				<select id="language-selector">
					<option value="es">Español</option>
					<option value="en">English</option>
				</select>
			</div>
		</div>

		<div class="titulo-texto">
			🃏 SEISES 🃏
		</div>

		<div class="header-right">
			<button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#howToPlayModal">
				📖 <span data-i18n="buttons.howToPlay"></span>
			</button>
		</div>
	</header>
    
    <div class="container">

        <div class="panel-control game-panel">

			<button id="configure-game"
					class="btn btn-primary"
					data-bs-toggle="modal"
					data-bs-target="#newGameModal"
					data-i18n="buttons.configureGame">
			</button>

			<button id="start-game" 
					class="btn btn-success" 
					data-i18n="buttons.startGame">
			</button>

			<div id="next-turn-container"></div>

        </div>

		<div id="scoreboard" class="game-panel d-none"></div>

		<div id="status-panel" class="status-panel game-panel info d-none"></div>
    </div>

    <div id="players-container" class="game-panel"></div>

	<div class="panel-mesa game-panel">
		<h2 class="mesa-titulo">
			🃏 <span data-i18n="headings.table"></span>
		</h2>

		<div class="row">
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.oros"></h4>
					<div id="oros-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.bastos"></h4>
					<div id="bastos-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.copas"></h4>
					<div id="copas-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.espadas"></h4>
					<div id="espadas-cards-container"></div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" 
			id="howToPlayModal" 
			tabindex="-1" 
			role="dialog" 
			aria-labelledby="howToPlayTitle" 
			aria-hidden="true">

		<div class="modal-dialog modal-lg" role="document">

			<div class="modal-content">

				<div class="modal-header">

					<h5 class="modal-title" id="howToPlayTitle">
						🃏 <span data-i18n="modal.howToPlay.title"></span>
					</h5>

					<button type="button" 
							class="btn-close" 
							data-bs-dismiss="modal">
					</button>

				</div>

				<div class="modal-body">
					<p>
						<strong data-i18n="modal.howToPlay.objective.title"></strong>
					</p>

					<p data-i18n="modal.howToPlay.objective.description"></p>

					<hr>

					<p>
						<strong data-i18n="modal.howToPlay.rules.title"></strong>
					</p>

					<ul>
						<li data-i18n="modal.howToPlay.rules.items.0"></li>
						<li data-i18n="modal.howToPlay.rules.items.1"></li>
						<li data-i18n="modal.howToPlay.rules.items.2"></li>
					</ul>

					<div class="text-center mb-3">
						<div class="sequence">
							<span>1</span>
							<span>2</span>
							<span>3</span>
							<span>4</span>
							<span>5</span>
							<span>6</span>
							<span>7</span>
							<span class="sequence-gap">10</span>
							<span>11</span>
							<span>12</span>
						</div>
					</div>

					<ul>
						<li data-i18n="modal.howToPlay.rules.items.3"></li>
						<li data-i18n="modal.howToPlay.rules.items.4"></li>
						<li data-i18n="modal.howToPlay.rules.items.5"></li>
					</ul>
				</div>

				<div class="modal-footer">
					<button class="btn btn-primary" 
							data-bs-dismiss="modal" 
							data-i18n="modal.howToPlay.close">
					</button>
				</div>

			</div>

		</div>

	</div>

	<div class="modal fade" 
			id="newGameModal" 
			tabindex="-1" 
			aria-labelledby="newGameModalLabel" 
			aria-hidden="true">

		<div class="modal-dialog modal-lg modal-dialog-centered">

			<div class="modal-content">

				<div class="modal-header">

					<h5 class="modal-title" 
							id="newGameModalLabel" 
							data-i18n="modal.configureGame.title">
					</h5>

					<button type="button" 
							class="btn-close" 
							data-bs-dismiss="modal" 
							aria-label="Close">
					</button>

				</div>

				<div class="modal-body">

					<div class="mb-4">
						<label for="humanPlayerName" 
								class="form-label" 
								data-i18n="modal.configureGame.humanPlayer">
						</label>

						<input id="humanPlayerName" 
								class="form-control" 
								type="text" 
								maxlength="12" />
					</div>

					<div class="mb-4">
						<label for="numberOfOpponents" 
								class="form-label d-block" 
								data-i18n="modal.configureGame.numberOfOpponents">
						</label>

						<div class="btn-group w-100" role="group">
							<input type="radio" 
									class="btn-check" 
									name="opponents" 
									id="opponents1" 
									value="1" 
									checked>
							<label class="btn btn-outline-primary" 
									for="opponents1">
								1
							</label>

							<input type="radio" 
									class="btn-check" 
									name="opponents" 
									id="opponents2" 
									value="2">
							<label class="btn btn-outline-primary" 
									for="opponents2">
								2
							</label>

							<input type="radio" 
									class="btn-check" 
									name="opponents" 
									id="opponents3" 
									value="3">
							<label class="btn btn-outline-primary" 
									for="opponents3">
								3
							</label>

							<input type="radio" 
									class="btn-check" 
									name="opponents" 
									id="opponents4" 
									value="4">
							<label class="btn btn-outline-primary" 
									for="opponents4">
								4
							</label>
						</div>
					</div>

					<hr/>

					<h6 class="mb-3" 
							data-i18n="modal.configureGame.opponents">
					</h6>

					<div class="row g-3">

						<div class="col-12">
							<label for="cpu1Name" 
									class="form-label" 
									data-i18n="modal.configureGame.opponentItem.0">
							</label>

							<input id="cpu1Name" 
									class="form-control" 
									type="text" 
									maxlength="12" />
						</div>

						<div class="col-12">
							<label for="cpu2Name" 
									class="form-label" 
									data-i18n="modal.configureGame.opponentItem.1">
							</label>

							<input id="cpu2Name" 
									class="form-control" 
									type="text"
									maxlength="12" />
						</div>

						<div class="col-12">
							<label for="cpu3Name" 
									class="form-label" 
									data-i18n="modal.configureGame.opponentItem.2">
							</label>

							<input id="cpu3Name" 
									class="form-control" 
									type="text"
									maxlength="12" />
						</div>

						<div class="col-12">
							<label for="cpu4Name" 
									class="form-label" 
									data-i18n="modal.configureGame.opponentItem.3">
							</label>

							<input id="cpu4Name" 
									class="form-control" 
									type="text"
									maxlength="12" />
						</div>

					</div>
				</div>

				<div class="modal-footer">
					<button type="button" 
							class="btn btn-secondary" 
							data-bs-dismiss="modal" 
							data-i18n="modal.configureGame.cancel">
					</button>

					<button type="button" 
							class="btn btn-primary" 
							id="startNewGameButton" 
							data-i18n="modal.configureGame.accept">
					</button>
				</div>
			</div>
		</div>
	</div>
	
	<footer class="footer">
		<div class="footer-title">
			🃏 SEISES 🃏
		</div>
		<div class="footer-version">
			<span data-i18n="footer.version"></span> 3.0
		</div>
		<div class="footer-author">
			<span data-i18n="footer.author"></span>
			<a href="https://github.com/mikepaskual" target="_blank" rel="noopener noreferrer">Miguel A. Pascual</a>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/underscore-min.js"></script>
    <script src="assets/i18n/es.js"></script>
    <script src="assets/i18n/en.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/juego.js"></script>
</body>
</html>
