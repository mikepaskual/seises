<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
	
    <title>Seises</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    
    <header class="titulo">
		<div class="header-left">
			<div class="language-selector">
				<select id="language-selector">
					<option value="es">Español</option>
					<option value="en">English</option>
				</select>
			</div>
		</div>

		<div class="titulo-texto">
			🃏 SEISES 🃏
		</div>

		<div class="header-right">
			<button class="btn btn-outline-light" data-toggle="modal" data-target="#howToPlayModal">
				📖 <span data-i18n="buttons.howToPlay"></span>
			</button>
		</div>
	</header>
    
    <div class="container">
        <div class="panel-control">
			<div class="scoreboard">
				🏆 <span id="victories-counter">0</span>
				<span class="score-separator">|</span>
				💀 <span id="defeats-counter">0</span>
			</div>
			<button id="new-game" class="btn btn-primary" data-i18n="buttons.newGame"></button>
			<div id="next-turn-container"></div>
        </div>

		<div id="status-panel" class="status-panel info">
			<span id="status-icon"></span>
			<span id="status-message"></span>
		</div>
    </div>

    <div class="panel-jugador">
        <h2>
			<span class="panel-title">
				<span class="panel-title-icon">🧑</span>
				<span data-i18n="headings.player"></span>
			</span>

			<small id="player-cards-counter"></small>
		</h2>
        <div id="player-cards-container"></div>
    </div>

    <div class="panel-jugador">
        <h2>
			<span class="panel-title">
				<span class="panel-title-icon">🤖</span>
				<span data-i18n="headings.ia"></span> 
			</span>
			
			<small id="computer-cards-counter"></small>
		</h2>
        <div id="computer-cards-container"></div>
    </div>

	<div class="panel-mesa">
		<h2 class="mesa-titulo">
			🃏 <span data-i18n="headings.table"></span>
		</h2>

		<div class="row">
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.oros"></h4>
					<div id="oros-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.bastos"></h4>
					<div id="bastos-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.copas"></h4>
					<div id="copas-cards-container"></div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="mesa-palo h-100">
					<h4 data-i18n="suits.espadas"></h4>
					<div id="espadas-cards-container"></div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="howToPlayModal" tabindex="-1" role="dialog" aria-labelledby="howToPlayTitle" aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="howToPlayTitle">
						🃏 <span data-i18n="howToPlay.title"></span>
					</h5>
					<button type="button" class="close" data-dismiss="modal">
						<span>&times;</span>
					</button>
				</div>

				<div class="modal-body">
					<p>
						<strong data-i18n="howToPlay.objective.title"></strong>
					</p>
					<p data-i18n="howToPlay.objective.description"></p>
					<hr>
					<p>
						<strong data-i18n="howToPlay.rules.title"></strong>
					</p>
					<ul>
						<li data-i18n="howToPlay.rules.items.0"></li>
						<li data-i18n="howToPlay.rules.items.1"></li>
						<li data-i18n="howToPlay.rules.items.2"></li>
					</ul>
					<div class="text-center mb-3">
						<div class="sequence">
							<span>1</span>
							<span>2</span>
							<span>3</span>
							<span>4</span>
							<span>5</span>
							<span>6</span>
							<span>7</span>
							<span class="sequence-gap">10</span>
							<span>11</span>
							<span>12</span>
						</div>
					</div>
					<ul>
						<li data-i18n="howToPlay.rules.items.3"></li>
						<li data-i18n="howToPlay.rules.items.4"></li>
						<li data-i18n="howToPlay.rules.items.5"></li>
					</ul>
				</div>

				<div class="modal-footer">
					<button class="btn btn-primary" data-dismiss="modal" data-i18n="howToPlay.close"></button>
				</div>
			</div>
		</div>
	</div>
	
<footer class="footer">
    <div class="footer-title">
        🃏 SEISES
    </div>
	<div class="footer-version">
		<span data-i18n="footer.version"></span> 2.0
	</div>
    <div class="footer-author">
		<span data-i18n="footer.author"></span>
		<a href="https://github.com/mikepaskual" target="_blank" rel="noopener noreferrer">Miguel A. Pascual</a>
    </div>
</footer>

	<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="assets/js/underscore-min.js"></script>
    <script src="assets/i18n/es.js"></script>
    <script src="assets/i18n/en.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/juego.js"></script>
</body>
</html>
